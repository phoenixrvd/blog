site_name: v.Wolf
site_url: "https://vwolf.eu"
site_dir: public
docs_dir: content
watch:
  - overrides
  - content
  - mkdocs.yml

extra:
  generator: false
  date_format: "%d.%m.%Y"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/phoenixrvd
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/viacheslav-wolf-5464392b9

extra_css:
  - styles/all.css

markdown_extensions:
  - attr_list
  - pymdownx.blocks.caption

plugins:
  - search
  - glightbox
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
  - blog:
      blog_dir: blog
      categories: true
      pagination: true
      blog_toc: true
      archive: false
      post_readtime: false
      post_url_date_format: yyyy/MM
      categories_url_format: "{slug}"
      pagination_per_page: 15
      draft_if_future_date: true
      categories_allowed:
        - DevOps
        - Prozesse
        - CI/CD
        - Blogging
  - mkdocs-simple-hooks:
      hooks:
        on_page_markdown: "hooks:insert_zotero_references"

theme:
  name: material
  language: de
  font: false # Disable Google fonts (No Cookie Consent)
  icon: false # Disable Fontawesome (No Cookie Consent)
  enable_jinja: true
  custom_dir: overrides
  logo: images/info.svg
  favicon: images/info.svg
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.tabs
    - navigation.expand
    - header.social
    - palette.toggle
  palette:
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Nachtmodus aktivieren
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Tagmodus aktivieren
